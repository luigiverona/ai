[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-workstation"
version = "1.0.2"
description = "Production-minded Arch Linux workstation setup"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Luigi Verona"}]
dependencies = []

[project.urls]
Repository = "https://github.com/luigiverona/ai"

[project.scripts]
ai = "ai_setup.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501", "S108", "S603", "S607"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["ai_setup"]
mypy_path = "src"

[tool.black]
line-length = 100
target-version = ["py311"]
