[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-workstation"
version = "0.1.1"
description = "Personal Arch Linux workstation reconciler"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ai = "ai.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
